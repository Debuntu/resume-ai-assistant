name: Resume AI Infrastructure CI/CD

on:
  # Deploy automatically when changes are pushed to main.
  push:
    branches:
      - main

  # Allow manual deployment or destruction from GitHub Actions.
  workflow_dispatch:
    inputs:
      action:
        description: "Terraform action to perform"
        required: true
        default: "apply"
        type: choice
        options:
          - apply
          - destroy

permissions:
  # Required for GitHub OIDC authentication with AWS.
  id-token: write

  # Required to check out the repository.
  contents: read

jobs:
  terraform:
    name: Terraform
    runs-on: ubuntu-latest

    steps:
      # Download the repository source code.
      - name: Checkout repository
        uses: actions/checkout@v4

      # Install the Terraform CLI.
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # Authenticate to AWS using GitHub OIDC.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::949100095136:role/resume-ai-github-actions-role
          aws-region: us-east-1

      # Initialize Terraform.
      - name: Terraform Init
        working-directory: terraform
        run: terraform init

      # Verify Terraform formatting.
      - name: Terraform Format Check
        working-directory: terraform
        run: terraform fmt -check

      # Validate the Terraform configuration.
      - name: Terraform Validate
        working-directory: terraform
        run: terraform validate

      # Create a Terraform execution plan.
      - name: Terraform Plan
        if: github.event_name == 'push' || github.event.inputs.action == 'apply'
        working-directory: terraform
        run: terraform plan

      # Deploy infrastructure automatically on main pushes.
      - name: Terraform Apply
        if: github.event_name == 'push' || github.event.inputs.action == 'apply'
        working-directory: terraform
        run: terraform apply -auto-approve

      # Destroy infrastructure only when manually requested.
      - name: Terraform Destroy
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'destroy'
        working-directory: terraform
        run: terraform destroy -auto-approve